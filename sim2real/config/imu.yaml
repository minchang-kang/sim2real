# sim2real/config/imu.yaml
bus: 1                           # I2C 버스 번호 (라즈베리파이에서는 일반적으로 1)
address_mpu: 0x68                # MPU9250 주소 (0x68 또는 0x69)
address_ak: 0x0C                 # 자력계 주소 (AK8963)

gfs: 1000                        # Gyroscope Full Scale: 250, 500, 1000, 2000
afs: 8                           # Accelerometer Full Scale: 2, 4, 8, 16
mfs: 16                          # Magnetometer Full Scale: 14 or 16 (bit)
mode: 6                          # Magnetometer Mode: 1~6 (C8Hz~C100Hz)

update_rate_hz: 200             # 내부 폴링 주기
enable_mag: true                # 자력계 사용 여부
